<g class="l0"><text x="22.0" y="64.0"><tspan fill="#9ece6a" class="b">$ </tspan></text><text class="c0" x="38.8" y="64.0"><tspan>gh envy create canary --reviewer octocat -r acme/sre --prevent-self-review \</tspan></text></g>
