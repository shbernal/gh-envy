<text class="l3" x="22.0" y="127.0"><tspan class="b">staging       </tspan><tspan>  </tspan><tspan fill="#7a8096">                              </tspan><tspan>  5m    custom     yes           </tspan><tspan fill="#7a8096">about 3 days ago</tspan></text>
<text class="l4" x="22.0" y="148.0"><tspan class="b">production    </tspan><tspan>  </tspan><tspan fill="#7a8096">octocat, acme/release-managers</tspan><tspan>  30m   custom     no            </tspan><tspan fill="#7a8096">about 1 day ago</tspan></text>
<text class="l5" x="22.0" y="169.0"><tspan class="b">preview/pr-128</tspan><tspan>  </tspan><tspan fill="#7a8096">                              </tspan><tspan>  none  protected  yes           </tspan><tspan fill="#7a8096">about 9 days ago</tspan></text>
