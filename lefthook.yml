remotes:
  - git_url: https://github.com/shbernal/lefthook-rules
    ref: v1
    configs:
      - rules/no-ai-attribution.yml
    refetch_frequency: 24h

pre-commit:
  jobs:
    - name: lint
      glob: "*.go"
      run: golangci-lint run
    - name: test
      glob: "*.go"
      run: go test ./...
